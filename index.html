<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050014">
<title>NEON BREAKOUT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#170634 0%,#050014 70%);font-family:'Arial Black',Impact,'Segoe UI',sans-serif;color:#fff;}

#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:1;}
body.fever::after{content:'';position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:overlay;opacity:.35;background:linear-gradient(120deg,#ff2bd1,#00e5ff,#39ff14,#ffe600,#ff2bd1);background-size:400% 400%;animation:feverBg 1.4s linear infinite;}
body.fever #c{animation:feverHue 1.1s linear infinite;}
body.feverLite #c{box-shadow:inset 0 0 60px 12px rgba(255,230,0,.5);}
@keyframes feverBg{to{background-position:400% 0;}}
@keyframes feverHue{to{filter:hue-rotate(360deg) saturate(1.6);}}

#hud{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none;}
#score{font-size:clamp(20px,5.5vw,32px);color:#00e5ff;text-shadow:0 0 8px #00e5ff,0 0 22px #00e5ff;}
#combo{font-size:clamp(14px,4vw,22px);color:#ff2bd1;text-shadow:0 0 8px #ff2bd1;}
#lives{font-size:clamp(14px,3.5vw,20px);}
#feverWrap{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:14px;right:14px;height:8px;background:#1a0630;border-radius:6px;overflow:hidden;z-index:5;border:1px solid #330a55;}
#feverBar{height:100%;width:0%;background:linear-gradient(90deg,#ff2bd1,#00e5ff,#39ff14,#ffe600);background-size:300% 100%;}
#feverWrap.on #feverBar{animation:slide .8s linear infinite;}
@keyframes slide{to{background-position:300% 0;}}

#buffRow{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));left:14px;display:flex;gap:8px;z-index:5;pointer-events:none;}
.buffChip{display:none;align-items:center;gap:5px;background:rgba(5,0,20,.55);border:1px solid currentColor;border-radius:10px;padding:3px 7px;font-size:13px;text-shadow:0 0 6px currentColor;}
.buffChip.show{display:flex;}
.buffChip .bbar{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;}
.buffChip .bfill{height:100%;width:100%;background:currentColor;border-radius:3px;}
#buffLaser{color:#00e5ff;} #buffNet{color:#39ff14;} #buffBomb{color:#ff7a00;}

#pop{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden;}
.pop{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(26px,8vw,58px);color:#fff;text-shadow:0 0 10px #ff2bd1,0 0 26px #00e5ff,0 0 44px #39ff14;letter-spacing:1px;white-space:nowrap;animation:popIn .85s cubic-bezier(.2,1.5,.4,1) forwards;}
.pop.small{font-size:clamp(13px,3.2vw,19px);text-shadow:0 0 8px currentColor;animation:popSmall 1s ease-out forwards;}
@keyframes popIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-6deg);}18%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(2deg);}32%{transform:translate(-50%,-50%) scale(1) rotate(0);}78%{opacity:1;}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) translateY(-50px);}}
@keyframes popSmall{0%{opacity:0;transform:translate(-50%,-50%) scale(.6);}20%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}100%{opacity:0;transform:translate(-50%,-70%) scale(1);}}

#gear{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:2px solid #00e5ff;background:#0b0224;color:#00e5ff;font-size:20px;z-index:10;box-shadow:0 0 12px rgba(0,229,255,.5);}
#fsBtn{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:2px solid #ff2bd1;background:#0b0224;color:#ff2bd1;font-size:20px;z-index:10;box-shadow:0 0 12px rgba(255,43,209,.5);}
#fireBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:2px solid #ff3b3b;background:#0b0224;color:#ff3b3b;font-size:22px;z-index:10;box-shadow:0 0 14px rgba(255,59,59,.55);touch-action:none;}
#fireBtn:active{background:#2a0505;}
#panel{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:min(78vw,300px);background:rgba(11,2,36,.93);border:1px solid rgba(255,43,209,.5);border-radius:14px;padding:14px;z-index:9;transform:translateY(16px) scale(.92);opacity:0;pointer-events:none;transition:.2s;}
#panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto;}
#panel .row{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.pbtn{padding:9px;border-radius:8px;border:1px solid #444;background:#1a0630;color:#fff;font-size:12px;font-family:inherit;}
.pbtn.on{border-color:#39ff14;color:#39ff14;box-shadow:0 0 8px rgba(57,255,20,.4);}
#panel label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#cfc3ea;}
#panel input[type=range]{width:100%;}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:20;background:rgba(3,0,12,0.86);padding:20px;}
.hidden{display:none!important;}
.screen h1{font-size:clamp(34px,10vw,72px);line-height:1.05;letter-spacing:3px;background:linear-gradient(90deg,#ff2bd1,#00e5ff,#39ff14);-webkit-background-clip:text;background-clip:text;color:transparent;animation:hueShift 3s linear infinite;}
.screen .tag{color:#00e5ff;font-size:clamp(14px,3.5vw,20px);}
.screen .hint{opacity:.85;animation:blink 1.2s ease-in-out infinite;font-size:clamp(13px,3vw,17px);}
.screen .best{color:#ffe600;font-size:clamp(13px,3vw,16px);}
.screen .stats{color:#fff;opacity:.9;font-size:clamp(12px,3vw,15px);line-height:1.7;}
#restartBtn{margin-top:8px;padding:12px 36px;border-radius:30px;border:2px solid #39ff14;background:#0b0224;color:#39ff14;font-size:clamp(15px,4vw,19px);letter-spacing:2px;font-weight:700;text-shadow:0 0 8px currentColor;box-shadow:0 0 16px rgba(57,255,20,.5);}
#restartBtn:active{background:#123a0a;}
#quitBtn{margin-top:8px;padding:11px 32px;border-radius:30px;border:2px solid #ff7a00;background:#0b0224;color:#ff7a00;font-size:clamp(14px,3.5vw,17px);letter-spacing:2px;font-weight:700;text-shadow:0 0 8px currentColor;box-shadow:0 0 14px rgba(255,122,0,.5);}
#quitBtn:active{background:#3a1a00;}
@keyframes blink{50%{opacity:.3;}}
@keyframes hueShift{to{filter:hue-rotate(360deg);}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="score">0</div>
  <div id="combo"></div>
  <div id="lives">❤️❤️❤️❤️❤️</div>
</div>
<div id="feverWrap"><div id="feverBar"></div></div>
<div id="buffRow">
  <div class="buffChip" id="buffLaser"><span>⚡</span><div class="bbar"><div class="bfill"></div></div></div>
  <div class="buffChip" id="buffNet"><span>🛡️</span><div class="bbar"><div class="bfill"></div></div></div>
  <div class="buffChip" id="buffBomb"><span>💣</span><div class="bbar"><div class="bfill"></div></div></div>
</div>
<div id="pop"></div>

<button id="gear">⚙️</button>
<button id="fsBtn">⛶</button>
<button id="fireBtn">🔥</button>
<div id="panel">
  <div class="row">
    <button class="pbtn" data-p="low">⚡ パフォーマンス優先 (軽量)</button>
    <button class="pbtn on" data-p="high">✨ 最高画質 (極彩)</button>
  </div>
  <label>⚡ SPEED
    <input id="spdRange" type="range" min="60" max="220" value="130">
  </label>
</div>

<div id="start" class="screen">
  <h1>NEON<br>BREAKOUT</h1>
  <p class="tag">爆速ドーパミン・ブロック崩し</p>
  <p class="hint">TAP / CLICK / SPACE で開始</p>
  <p class="best">BEST: <span id="bestS">0</span></p>
</div>
<div id="over" class="screen hidden">
  <h1>GAME OVER</h1>
  <p id="finalScore" class="tag"></p>
  <p id="finalStats" class="stats"></p>
  <button id="restartBtn">RESTART</button>
</div>
<div id="pauseScr" class="screen hidden">
  <h1>PAUSE</h1>
  <p class="hint">ESC または タップで再開</p>
  <button id="quitBtn">終了する</button>
</div>

<script>
'use strict';
const c=document.getElementById('c'), ctx=c.getContext('2d');
const elScore=document.getElementById('score'), elLives=document.getElementById('lives'), elCombo=document.getElementById('combo'),
      elFeverBar=document.getElementById('feverBar'), elFeverWrap=document.getElementById('feverWrap'),
      elFinal=document.getElementById('finalScore'), elFinalStats=document.getElementById('finalStats'), elBest=document.getElementById('bestS'),
      elStart=document.getElementById('start'), elOver=document.getElementById('over'),
      elPop=document.getElementById('pop'), elGear=document.getElementById('gear'), elPanel=document.getElementById('panel'),
      elPause=document.getElementById('pauseScr'), elFsBtn=document.getElementById('fsBtn'),
      elFireBtn=document.getElementById('fireBtn'), elRestartBtn=document.getElementById('restartBtn'),
      elQuitBtn=document.getElementById('quitBtn'),
      elBuffLaser=document.getElementById('buffLaser'), elBuffNet=document.getElementById('buffNet'), elBuffBomb=document.getElementById('buffBomb');

let W=0,H=0,DPR=1;
let mode='ready';
let score=0, lives=5, combo=0, comboT=0;
let fever=0, feverOn=false, feverT=0;
let shake=0;
let perf='high', autoLow=false;
let spd=1.3;
let stage=1, elapsedPlay=0, heat=0, comboHeat=0, bricksDestroyed=0, itemsCollected=0;
let pointerX=null, inputMode='pointer';
const keys={l:false,r:false};
let lifeFireHeld=false, lifeFireCd=0;
const pad={x:0,y:0,w:110,h:16};
let balls=[], bricks=[], parts=[], pups=[], lasers=[];
const buffs={laser:0,net:0,bomb:0};
let laserCd=0;
let best=0; try{ best=+localStorage.getItem('neonBreakoutBest')||0; }catch(e){}
elBest.textContent=best;

const FEVER_MS=9000, LASER_MS=16000, NET_MS=20000, BOMB_MS=18000, LASER_IV=140, COMBO_WIN=1300;
const PAL=['#ff2bd1','#00e5ff','#39ff14','#ffe600','#ff7a00','#c400ff'];
const COMBO_MSGS=[[5,'NICE!'],[10,'10 COMBO!'],[15,'ON FIRE!!'],[20,'HYPER!!'],[30,'INSANE!!'],[40,'GODLIKE!!'],[60,'UNREAL!!'],[80,'LEGENDARY!!']];
const ICONS={life:'💛',multi:'🔴',laser:'⚡',net:'🛡️',bomb:'💣'};

function clamp(v,a,b){ return v<a?a:v>b?b:v; }

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  c.width=W*DPR; c.height=H*DPR;
  c.style.width=W+'px'; c.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  pad.w=clamp(W*0.16,72,170); pad.h=16; pad.y=H-50;
  pad.x=clamp(pad.x,0,W-pad.w);
}

// ---------- audio ----------
let actx=null, liveSounds=0;
function ensureAudio(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function beep(freq,dur,type,vol,slide){
  if(!actx || liveSounds>=10) return;
  liveSounds++;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), actx.currentTime+dur);
    g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
    o.onended=()=>{ liveSounds=Math.max(0,liveSounds-1); };
  }catch(e){ liveSounds=Math.max(0,liveSounds-1); }
}
function sfx(n){
  switch(n){
    case 'wall': beep(220,.05,'square',.10); break;
    case 'paddle': beep(300,.06,'square',.15); break;
    case 'hit': beep(480+Math.random()*160,.05,'square',.12); break;
    case 'destroy': beep(700+Math.random()*300,.11,'sawtooth',.16,-260); break;
    case 'catch': beep(660,.06,'square',.15); setTimeout(()=>beep(990,.08,'square',.15),60); break;
    case 'laser': beep(1200,.04,'sawtooth',.08,-500); break;
    case 'bomb': beep(90,.25,'sawtooth',.22,-60); break;
    case 'miss': beep(220,.3,'sawtooth',.2,-180); break;
    case 'fever': beep(440,.4,'sine',.2,600); break;
  }
}

// ---------- popups ----------
function bigPop(msg){
  const el=document.createElement('div'); el.className='pop'; el.textContent=msg;
  elPop.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}
function popText(px,py,msg,col){
  const el=document.createElement('div'); el.className='pop small'; el.textContent=msg;
  el.style.left=(px/W*100)+'%'; el.style.top=(py/H*100)+'%'; el.style.color=col;
  elPop.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}
function checkCombo(){ const hit=COMBO_MSGS.find(x=>x[0]===combo); if(hit) bigPop(hit[1]); }

// ---------- entities ----------
function buildBricks(){
  bricks=[];
  const cols=clamp(6+Math.floor(stage/2),6,10);
  const rows=clamp(4+Math.floor(stage/2),4,8);
  const top=H*0.16, gap=6, mx=14;
  const bw=(W-mx*2-gap*(cols-1))/cols, bh=clamp(H*0.03+12,18,26);
  for(let r=0;r<rows;r++){
    for(let i=0;i<cols;i++){
      const hp=r<rows*0.25?2:1;
      bricks.push({x:mx+i*(bw+gap), y:top+r*(bh+gap), w:bw, h:bh, hp, maxhp:hp, col:PAL[r%PAL.length], alive:true});
    }
  }
}
function readyBall(){ return {x:pad.x+pad.w/2, y:pad.y-9, vx:0, vy:0, r:7, pierce:false, launched:false}; }
function launchedBall(){
  const a=(Math.random()*0.6-0.3), s=12*spd*(1+comboHeat*0.2);
  return {x:pad.x+pad.w/2, y:pad.y-9, vx:Math.sin(a)*s, vy:-Math.abs(Math.cos(a)*s), r:7, pierce:feverOn, launched:true};
}
function launch(){
  for(const b of balls){
    if(!b.launched){
      b.launched=true;
      const a=(Math.random()*0.6-0.3), s=12*spd;
      b.vx=Math.sin(a)*s; b.vy=-Math.abs(Math.cos(a)*s);
    }
  }
}

// ---------- flow ----------
function startGame(){
  ensureAudio();
  mode='play'; score=0; lives=5; combo=0; comboT=0; fever=0; feverOn=false; feverT=0;
  stage=1; elapsedPlay=0; heat=0; shake=0; bricksDestroyed=0; itemsCollected=0;
  lifeFireHeld=false; lifeFireCd=0;
  buffs.laser=0; buffs.net=0; buffs.bomb=0; laserCd=0;
  parts.length=0; pups.length=0; lasers.length=0;
  document.body.classList.remove('fever','feverLite');
  buildBricks();
  pad.x=W/2-pad.w/2;
  balls=[readyBall()];
  elStart.classList.add('hidden'); elOver.classList.add('hidden');
  paused=false; elPause.classList.add('hidden');
}
function fmtTime(ms){
  const s=Math.floor(ms/1000); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function gameOver(){
  mode='over';
  if(score>best){ best=score; try{ localStorage.setItem('neonBreakoutBest',best); }catch(e){} }
  elFinal.textContent='SCORE '+score+'  /  BEST '+best;
  elFinalStats.innerHTML=
    '破壊ブロック数: '+bricksDestroyed+'<br>'+
    'クリアステージ数: '+(stage-1)+'<br>'+
    '取得アイテム数: '+itemsCollected+'<br>'+
    '生存時間: '+fmtTime(elapsedPlay);
  elOver.classList.remove('hidden');
  sfx('miss');
}
function loseLife(){
  lives--; combo=0; addShake(9); sfx('miss');
  if(lives<=0) gameOver(); else balls=[readyBall()];
}
function nextStage(){
  stage++; score+=500*stage; bigPop('STAGE CLEAR!!');
  buildBricks();
}

// ---------- power-ups ----------
function spawnPowerup(px,py){
  const types=['life','multi','laser','net','bomb'];
  pups.push({x:px,y:py,vy:3.2*spd,type:types[Math.floor(Math.random()*types.length)]});
}
function applyPowerup(type){
  itemsCollected++;
  sfx('catch');
  const cx=pad.x+pad.w/2, cy=pad.y-22;
  if(type==='life'){ lives++; popText(cx,cy,'+1 LIFE','#ffe600'); }
  else if(type==='multi'){
    const src=balls[balls.length-1];
    if(src){
      const target=3+Math.floor(Math.random()*3);
      const need=Math.max(0, Math.min(target-balls.length, 8-balls.length));
      for(let i=0;i<need;i++){
        const ang=(Math.random()-0.5)*1.4, mag=Math.hypot(src.vx,src.vy)||12*spd;
        balls.push({x:src.x,y:src.y,vx:Math.sin(ang)*mag,vy:-Math.abs(Math.cos(ang)*mag),r:src.r,pierce:src.pierce,launched:true});
      }
    }
    popText(cx,cy,'MULTI BALL!!','#ff2bd1');
  }
  else if(type==='laser'){ buffs.laser=LASER_MS; popText(cx,cy,'LASER!!','#00e5ff'); }
  else if(type==='net'){ buffs.net=NET_MS; popText(cx,cy,'SAFETY NET','#39ff14'); }
  else if(type==='bomb'){ buffs.bomb=BOMB_MS; popText(cx,cy,'BOMB MODE!!','#ff7a00'); }
}
function fireLaser(){
  lasers.push({x:pad.x+12,y:pad.y}, {x:pad.x+pad.w-12,y:pad.y});
  sfx('laser');
}

// ---------- combat ----------
function addShake(v){ shake=Math.min(24, shake+v*(1+heat*0.4)); }
function spawnParticles(px,py,col,n){
  const cap=perfEff()==='high'?260:70;
  const cnt=Math.min(n, Math.max(0,cap-parts.length));
  for(let i=0;i<cnt;i++){
    const a=Math.random()*Math.PI*2, sp=2+Math.random()*5;
    parts.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2,life:400+Math.random()*300,max:700,col,size:2+Math.random()*3});
  }
}
function destroyBrick(br,chain){
  if(!br.alive) return;
  br.alive=false;
  bricksDestroyed++;
  const mult=feverOn?10:1;
  score+=Math.round(10*(1+combo*0.08)*mult);
  spawnParticles(br.x+br.w/2, br.y+br.h/2, br.col, chain?16:9);
  if(!chain){
    combo++; comboT=COMBO_WIN;
    fever=Math.min(1, fever+0.018+Math.min(combo,30)*0.001);
    addShake(2.2+Math.min(combo,12)*0.35);
    checkCombo();
    if(Math.random()<0.28) spawnPowerup(br.x+br.w/2, br.y+br.h/2);
    sfx('destroy');
  }
  if(buffs.bomb>0){
    addShake(5); sfx('bomb');
    for(const o of bricks){
      if(o.alive && o!==br && Math.hypot((o.x+o.w/2)-(br.x+br.w/2),(o.y+o.h/2)-(br.y+br.h/2))<68){
        destroyBrick(o,true);
      }
    }
  }
}

// ---------- physics ----------
function updatePaddle(dtF){
  if(inputMode==='pointer' && pointerX!=null) pad.x=pointerX-pad.w/2;
  else if(keys.l) pad.x-=19*spd*dtF;
  else if(keys.r) pad.x+=19*spd*dtF;
  pad.x=clamp(pad.x,0,W-pad.w);
}
function updateLifeFire(dt){
  if(lifeFireHeld && lives>1){
    lifeFireCd-=dt;
    if(lifeFireCd<=0){
      lifeFireCd=160;
      balls.push(launchedBall());
      lives--;
      sfx('catch'); addShake(3);
    }
  } else lifeFireCd=0;
}
function updateBall(b,dtF){
  if(!b.launched){ b.x=pad.x+pad.w/2; b.y=pad.y-b.r-2; return; }
  const mag=Math.hypot(b.vx,b.vy);
  const steps=clamp(Math.ceil((mag*dtF)/10),1,6);
  const sdt=dtF/steps;
  for(let s=0;s<steps;s++){
    b.x+=b.vx*sdt; b.y+=b.vy*sdt;
    if(b.x-b.r<0){ b.x=b.r; b.vx=Math.abs(b.vx); sfx('wall'); }
    else if(b.x+b.r>W){ b.x=W-b.r; b.vx=-Math.abs(b.vx); sfx('wall'); }
    if(b.y-b.r<0){ b.y=b.r; b.vy=Math.abs(b.vy); sfx('wall'); }
    if(buffs.net>0 && b.vy>0 && b.y+b.r>=H-16){ b.y=H-16-b.r; b.vy=-Math.abs(b.vy); }
    if(b.vy>0 && b.y+b.r>=pad.y && b.y+b.r<=pad.y+pad.h+16 && b.x>pad.x-6 && b.x<pad.x+pad.w+6){
      const hitPos=clamp((b.x-(pad.x+pad.w/2))/(pad.w/2),-1,1);
      const keepMag=Math.max(mag,12)*(1+comboHeat*0.35);
      const ang=hitPos*1.05;
      b.vx=Math.sin(ang)*keepMag; b.vy=-Math.abs(Math.cos(ang)*keepMag);
      b.y=pad.y-b.r-1;
      sfx('paddle'); addShake(2);
    }
    for(const br of bricks){
      if(!br.alive) continue;
      if(b.x+b.r>br.x && b.x-b.r<br.x+br.w && b.y+b.r>br.y && b.y-b.r<br.y+br.h){
        if(b.pierce){ destroyBrick(br,false); continue; }
        const ox=Math.min(b.x+b.r-br.x, br.x+br.w-(b.x-b.r));
        const oy=Math.min(b.y+b.r-br.y, br.y+br.h-(b.y-b.r));
        if(ox<oy) b.vx=-b.vx; else b.vy=-b.vy;
        br.hp--;
        if(br.hp<=0) destroyBrick(br,false); else { spawnParticles(b.x,b.y,br.col,3); sfx('hit'); }
        break;
      }
    }
    if(b.y-b.r>H){ b._dead=true; break; }
  }
}

// ---------- main update ----------
function update(dtF,dt){
  shake=Math.max(0, shake-0.5*dtF);
  if(mode!=='play') return;
  elapsedPlay+=dt;
  updatePaddle(dtF);
  updateLifeFire(dt);

  if(combo>0){ comboT-=dt; if(comboT<=0) combo=0; }

  if(feverOn){
    feverT-=dt;
    if(feverT<=0){
      feverOn=false; fever=0;
      for(const b of balls) b.pierce=false;
      document.body.classList.remove('fever','feverLite');
    }
  } else if(fever>=1){
    feverOn=true; feverT=FEVER_MS; fever=1;
    for(const b of balls) b.pierce=true;
    sfx('fever'); bigPop('FEVER!!');
  }
  if(feverOn){
    document.body.classList.toggle('fever', perfEff()==='high');
    document.body.classList.toggle('feverLite', perfEff()==='low');
  }

  buffs.laser=Math.max(0,buffs.laser-dt);
  buffs.net=Math.max(0,buffs.net-dt);
  buffs.bomb=Math.max(0,buffs.bomb-dt);
  if(buffs.laser>0){ laserCd-=dt; if(laserCd<=0){ laserCd=LASER_IV; fireLaser(); } } else laserCd=0;

  heat=Math.min(1, elapsedPlay/70000 + combo/50);
  comboHeat=Math.min(1, combo/50);

  for(let i=balls.length-1;i>=0;i--){ updateBall(balls[i],dtF); if(balls[i]._dead) balls.splice(i,1); }
  if(balls.length===0){ if(feverOn) balls.push(launchedBall()); else loseLife(); }

  for(let i=pups.length-1;i>=0;i--){
    const p=pups[i]; p.vy+=0.06*dtF; p.y+=p.vy*dtF;
    if(p.y>pad.y-4 && p.y<pad.y+pad.h && p.x>pad.x-10 && p.x<pad.x+pad.w+10){ applyPowerup(p.type); pups.splice(i,1); }
    else if(p.y>H+30){ pups.splice(i,1); }
  }
  for(let i=lasers.length-1;i>=0;i--){
    const l=lasers[i]; l.y-=16*spd*dtF; let hit=false;
    for(const br of bricks){ if(br.alive && l.x>br.x && l.x<br.x+br.w && l.y>br.y && l.y<br.y+br.h){ destroyBrick(br,false); hit=true; break; } }
    if(hit || l.y<-20) lasers.splice(i,1);
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.x+=p.vx*dtF; p.y+=p.vy*dtF; p.vy+=0.15*dtF; p.life-=dt;
    if(p.life<=0) parts.splice(i,1);
  }

  if(bricks.length && bricks.every(b=>!b.alive)) nextStage();
  updateHud();
}

function updateHud(){
  elScore.textContent=score;
  elLives.textContent='❤️'.repeat(Math.max(0,lives));
  elCombo.textContent=combo>1?('COMBO x'+combo):'';
  const pct=feverOn?(feverT/FEVER_MS):fever;
  elFeverBar.style.width=(pct*100)+'%';
  elFeverWrap.classList.toggle('on',feverOn);
  setBuffChip(elBuffLaser,buffs.laser,LASER_MS);
  setBuffChip(elBuffNet,buffs.net,NET_MS);
  setBuffChip(elBuffBomb,buffs.bomb,BOMB_MS);
}
function setBuffChip(el,val,max){
  el.classList.toggle('show',val>0);
  if(val>0) el.querySelector('.bfill').style.width=(100*Math.max(0,val)/max)+'%';
}

// ---------- fps / perf scaling ----------
let fpsAvg=60, fpsBad=0, fpsGood=0;
function trackFps(dt){
  const inst=1000/Math.max(1,dt);
  fpsAvg=fpsAvg*0.9+inst*0.1;
  if(fpsAvg<40){ fpsBad++; fpsGood=0; } else if(fpsAvg>=55){ fpsGood++; fpsBad=0; } else { fpsBad=0; fpsGood=0; }
  if(fpsBad>90) autoLow=true;
  if(fpsGood>260) autoLow=false;
}
function perfEff(){ return (perf==='low'||autoLow)?'low':'high'; }
function hexLighten(hex,amt){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r+= (255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt;
  return `rgb(${r|0},${g|0},${b|0})`;
}

// ---------- render ----------
function render(){
  const eff=perfEff();
  ctx.save();
  if(shake>0.1) ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  ctx.fillStyle= eff==='high' ? 'rgba(5,0,20,0.22)' : '#050014';
  ctx.fillRect(-30,-30,W+60,H+60);

  if(buffs.net>0){
    ctx.shadowColor='#39ff14'; ctx.shadowBlur=eff==='high'?20:0;
    ctx.fillStyle='rgba(57,255,20,0.55)';
    ctx.fillRect(0,H-16,W,6);
  }

  for(const br of bricks){
    if(!br.alive) continue;
    const dmg=1-br.hp/br.maxhp;
    ctx.shadowColor=br.col;
    if(eff==='high'){
      ctx.shadowBlur=14*(1-dmg*0.5);
      ctx.fillStyle= dmg>0 ? hexLighten(br.col,dmg*0.7) : br.col;
      ctx.globalAlpha=1-dmg*0.55;
    } else {
      ctx.shadowBlur=0;
      ctx.fillStyle=br.col; ctx.globalAlpha=0.35+0.65*(br.hp/br.maxhp);
    }
    ctx.beginPath(); ctx.roundRect(br.x,br.y,br.w,br.h,5); ctx.fill();
  }
  ctx.globalAlpha=1;

  ctx.shadowColor='#00e5ff'; ctx.shadowBlur=eff==='high'?22:0;
  ctx.fillStyle= buffs.laser>0 ? '#00e5ff' : '#ffffff';
  ctx.beginPath(); ctx.roundRect(pad.x,pad.y,pad.w,pad.h,8); ctx.fill();

  ctx.shadowBlur=eff==='high'?12:0; ctx.shadowColor='#00e5ff'; ctx.fillStyle='#00e5ff';
  for(const l of lasers) ctx.fillRect(l.x-2,l.y-14,4,14);

  ctx.font='24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowBlur=eff==='high'?10:0; ctx.shadowColor='#fff';
  for(const p of pups) ctx.fillText(ICONS[p.type], p.x, p.y);

  for(const pt of parts){
    ctx.globalAlpha=Math.max(0,pt.life/pt.max);
    ctx.shadowBlur=eff==='high'?8:0; ctx.shadowColor=pt.col; ctx.fillStyle=pt.col;
    ctx.fillRect(pt.x-pt.size/2, pt.y-pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha=1;

  for(const b of balls){
    ctx.shadowColor= b.pierce?'#ffe600':'#ff2bd1'; ctx.shadowBlur=eff==='high'?20:0;
    ctx.fillStyle= b.pierce?'#ffe600':'#ffffff';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur=0;
  ctx.restore();
}

// ---------- input ----------
let lastAct=0, paused=false;
function togglePause(){
  if(mode!=='play') return;
  paused=!paused;
  elPause.classList.toggle('hidden', !paused);
}
function handleActivate(e){
  if(paused) return;
  const now=performance.now();
  if(now-lastAct<300) return; lastAct=now;
  if(e && e.preventDefault) e.preventDefault();
  ensureAudio();
  if(mode==='ready') startGame();
  else if(mode==='play') launch();
}
addEventListener('mousemove', e=>{ pointerX=e.clientX; inputMode='pointer'; });
c.addEventListener('mousedown', handleActivate);
c.addEventListener('touchstart', e=>{ pointerX=e.touches[0].clientX; inputMode='pointer'; handleActivate(e); }, {passive:false});
c.addEventListener('touchmove', e=>{ e.preventDefault(); pointerX=e.touches[0].clientX; inputMode='pointer'; }, {passive:false});
elStart.addEventListener('click', handleActivate);
elStart.addEventListener('touchstart', handleActivate, {passive:false});
elRestartBtn.addEventListener('click', e=>{ e.stopPropagation(); startGame(); });
elRestartBtn.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); startGame(); }, {passive:false});
elFireBtn.addEventListener('mousedown', e=>{ e.preventDefault(); lifeFireHeld=true; });
addEventListener('mouseup', ()=>{ lifeFireHeld=false; });
elFireBtn.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); lifeFireHeld=true; }, {passive:false});
elFireBtn.addEventListener('touchend', e=>{ e.preventDefault(); lifeFireHeld=false; }, {passive:false});
elFireBtn.addEventListener('touchcancel', ()=>{ lifeFireHeld=false; });
addEventListener('keydown', e=>{
  if(e.code==='ArrowLeft'){ keys.l=true; inputMode='key'; e.preventDefault(); }
  else if(e.code==='ArrowRight'){ keys.r=true; inputMode='key'; e.preventDefault(); }
  else if(e.code==='Space'){ handleActivate(e); }
  else if(e.code==='Escape'){ togglePause(); }
  else if(e.code==='KeyF'){ lifeFireHeld=true; e.preventDefault(); }
});
elPause.addEventListener('click', ()=>{ if(paused) togglePause(); });
elPause.addEventListener('touchstart', e=>{ e.preventDefault(); if(paused) togglePause(); }, {passive:false});
function quitToResults(){
  paused=false; elPause.classList.add('hidden');
  gameOver();
}
elQuitBtn.addEventListener('click', e=>{ e.stopPropagation(); quitToResults(); });
elQuitBtn.addEventListener('touchstart', e=>{ e.preventDefault(); e.stopPropagation(); quitToResults(); }, {passive:false});
addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft') keys.l=false;
  if(e.code==='ArrowRight') keys.r=false;
  if(e.code==='KeyF') lifeFireHeld=false;
});
addEventListener('resize', resize);

elGear.addEventListener('click', ()=>elPanel.classList.toggle('open'));
elFsBtn.addEventListener('click', ()=>{
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
});
document.querySelectorAll('.pbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    perf=btn.dataset.p;
    document.querySelectorAll('.pbtn').forEach(b=>b.classList.toggle('on', b===btn));
  });
});
document.getElementById('spdRange').addEventListener('input', e=>{ spd=e.target.value/100; });

// ---------- main loop ----------
let last=performance.now();
function loop(now){
  let dt=now-last; last=now;
  if(dt>250) dt=250;
  requestAnimationFrame(loop);
  if(paused) return;
  trackFps(dt);
  update(dt/16.6667, dt);
  render();
}

// ---------- init ----------
resize();
pad.x=W/2-pad.w/2;
buildBricks();
balls=[readyBall()];
requestAnimationFrame(loop);
</script>
</body>
